name: Site quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json
            hearts-worker/package-lock.json
            analytics-worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix agent
      - run: npm ci --prefix hearts-worker
      - run: npm ci --prefix analytics-worker
      - run: npm run lint
      - run: npm test
      - run: npm --prefix agent test
      - run: npm --prefix hearts-worker test
      - run: npm --prefix analytics-worker test
      - run: npm run test:export
      - name: Check known high-severity dependency advisories
        run: |
          npm audit --audit-level=high
          npm audit --prefix agent --audit-level=high
          npm audit --prefix hearts-worker --audit-level=high
          npm audit --prefix analytics-worker --audit-level=high
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run build
      - run: npm run check:export
