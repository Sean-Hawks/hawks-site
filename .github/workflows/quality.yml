name: Site quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json
      - run: npm ci
      - run: npm ci --prefix agent
      - run: npm run lint
      - run: npm test
      - run: npm --prefix agent test
      - run: npm run test:export
      - name: Check known high-severity dependency advisories
        run: |
          npm audit --audit-level=high
          npm audit --prefix agent --audit-level=high
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run build
      - run: npm run check:export
